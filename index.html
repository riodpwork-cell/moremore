      '<p class="preview" id="ap-prev" aria-live="polite"></p><p class="err" id="ap-err" role="alert"></p>' +
      '<div class="actions"><button type="submit" class="btn primary">Tambah pembelian</button></div></form>' +
      '<hr class="sep"><div class="actions" style="justify-content:space-between"><span class="hint">' + (used.length ? 'Dipakai di: ' + used.map(function (m) { return esc(m.name); }).join(', ') : 'Belum dipakai di menu mana pun') + '</span>' +
      '<button type="button" class="btn danger" data-act="del-ing" data-id="' + esc(ing.id) + '">Hapus bahan</button></div>', focusSel || '#ei-name');
    updatePurchasePreview(ing);
  }
  function updatePurchasePreview(ing) {
    var p = $('#ap-prev', dlg); if (!p) return;
    p.textContent = previewFor(ing, numOrNull($('#ap-qty', dlg).value), $('#ap-unit', dlg).value, numOrNull($('#ap-price', dlg).value));
  }

  function openConfirm(title, text, act, data, label) {
    var attrs = Object.keys(data || {}).map(function (k) { return ' data-' + k + '="' + esc(data[k]) + '"'; }).join('');
    openDlg(dlgHead(title) + '<p>' + text + '</p><div class="actions"><button type="button" class="btn" data-act="close">Batal</button>' +
      '<button type="button" class="btn danger" data-act="' + act + '"' + attrs + '>' + label + '</button></div>');
  }
  function openNewMenu() {
    openDlg(dlgHead('Menu baru') + '<form id="f-new-menu" novalidate><div class="field"><label for="nm-name">Nama menu</label><input id="nm-name" type="text" autocomplete="off"></div>' +
      '<p class="err" id="nm-err" role="alert"></p><div class="actions"><button type="button" class="btn" data-act="close">Batal</button><button type="submit" class="btn primary">Buat menu</button></div></form>', '#nm-name');
  }

  function openBackup() {
    var json = JSON.stringify(state, null, 2);
    openDlg(dlgHead('Data dan cadangan') +
      '<p>Data ada di browser ini saja. Salin cadangan untuk memindahkannya ke iPhone atau laptop lain, atau sebelum membersihkan browser.</p>' +
      '<div class="field"><label for="bk-out">Cadangan saat ini</label><textarea id="bk-out" readonly>' + esc(json) + '</textarea></div>' +
      '<div class="actions"><button type="button" class="btn primary" data-act="copy-backup">Salin cadangan</button></div>' +
      '<hr class="sep"><form id="f-restore" novalidate><div class="field"><label for="bk-in">Pulihkan dari cadangan</label><textarea id="bk-in" placeholder="Tempel teks cadangan di sini"></textarea><span class="hint">Memulihkan menimpa semua data di browser ini.</span></div>' +
      '<p class="err" id="bk-err" role="alert"></p><div class="actions"><button type="submit" class="btn danger">Pulihkan dan timpa data</button></div></form>', '#bk-out');
  }

  /* ---------- router ---------- */
  var current = null;
  var routes = {};
  var navEl = $('#nav');
  function addRoute(id, def) { routes[id] = def; }
  function routeList() {
    return Object.keys(routes).map(function (k) { return { id: k, def: routes[k] }; })
      .sort(function (a, b) { return a.def.order - b.def.order; });
  }
  function buildNav() {
    var IC = {
      dashboard: '<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 8h6V4h-6z"/>',
      asisten: '<path d="M4 5h16v11H9l-5 4zM8 9.5h8M8 12.5h5"/>',
      rekap: '<path d="M7 3h10v18H7zM10 8h4M10 12h4M10 16h2"/>',
      kirim: '<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7zM7 19a1.5 1.5 0 1 0 0-.01M17 19a1.5 1.5 0 1 0 0-.01"/>',
      produksi: '<path d="M5 10h14l-1.5 9h-11zM8 10V6h8v4M12 3v3"/>',
      menu: '<path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/>',
      homemade: '<path d="M8 3h8M10 3v5l-5 10a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-10V3"/>',
      belanja: '<path d="M4 5h2l2 10h9l2-7H7M10 19.5h.01M16 19.5h.01"/>',
      stok: '<path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/>',
      bank: '<path d="M4 20h16M6 20V10M10 20V10M14 20V10M18 20V10M3 10l9-6 9 6z"/>',
      laporan: '<path d="M5 20V10M12 20V4M19 20v-7"/>',
      pengaturan: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4"/>',
      tambah: '<path d="M12 5v14M5 12h14"/>',
      more: '<path d="M5 12h.01M12 12h.01M19 12h.01"/>'
    };
    window.CC.icons = IC;
    function ico(k) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (IC[k] || '') + '</svg>'; }
    navEl.innerHTML = routeList().map(function (r) {
      return '<a href="#' + r.id + '" data-nav="' + r.id + '"' + (r.def.primary ? '' : ' class="more"') + '>' + ico(r.id) + '<span>' + esc(r.def.label) + '</span></a>';
    }).join('') + '<button type="button" class="navmore" data-act="more">' + ico('more') + '<span>Lainnya</span></button>';
  }
  function openMore() {
    var links = routeList().filter(function (r) { return !r.def.primary; }).map(function (r) {
      return '<a class="btn" href="#' + r.id + '" data-act="close">' + esc(r.def.label) + '</a>';
    }).join('');
    openDlg(dlgHead('Lainnya') + '<div class="morelist">' + links +
      '<button type="button" class="btn" data-act="backup">Data dan cadangan</button></div>');
  }
  function routeName() { var h = (location.hash || '').slice(1); return routes[h] ? h : 'dashboard'; }
  function render(moveFocus) {
    var r = routeName();
    document.querySelectorAll('[data-nav]').forEach(function (a) {
      if (a.getAttribute('data-nav') === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    var mb = $('.navmore');
    if (mb) { if (!routes[r].primary) mb.setAttribute('aria-current', 'true'); else mb.removeAttribute('aria-current'); }
    if (loadError) { renderLoadError(); return; }
    renderBanners();
    routes[r].render();
    renderHooks.forEach(function (f) { try { f(r); } catch (x) { /* hook gagal tidak boleh menghentikan render */ } });
    if (moveFocus) {
      view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
      var h = view.querySelector('h1'); if (h) h.focus({ preventScroll: true });
      window.scrollTo(0, 0);
    }
    current = r;
  }
  function renderLoadError() {
    banners.innerHTML = '';
    view.innerHTML = '<section aria-labelledby="h-err"><h1 id="h-err" tabindex="-1">Data tersimpan tidak bisa dibaca</h1>' +
      '<p class="lede" style="margin:8px 0 16px">Penyebab: ' + esc(loadError.message) + '. Data lama belum dihapus. Salin dulu bila ingin mencoba memperbaikinya, lalu mulai dari data contoh.</p>' +
      '<div class="field" style="margin-bottom:12px"><label for="raw">Isi data tersimpan</label><textarea id="raw" readonly>' + esc(loadError.raw) + '</textarea></div>' +
      '<div class="actions" style="justify-content:flex-start"><button type="button" class="btn" data-act="copy-raw">Salin isi data</button>' +
      '<button type="button" class="btn danger" data-act="reset-all">Mulai dari data contoh</button></div></section>';
  }
  window.addEventListener('hashchange', function () { render(true); });
  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (t && t.tagName === 'INPUT' && t.type === 'number') setTimeout(function () { try { t.select(); } catch (x) {} }, 0);
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (e.key !== 'Enter' || !t || t.tagName !== 'INPUT' || t.type !== 'number' || t.form) return;
    var all = Array.prototype.slice.call(view.querySelectorAll('input[type=number]:not([disabled])'));
    var i = all.indexOf(t);
    if (i > -1 && all[i + 1]) { e.preventDefault(); all[i + 1].focus(); }
    else if (i > -1) { t.blur(); }
  });

  /* ---------- events ---------- */
  function copyText(text, ta) {
    function fallback() { if (ta) { ta.focus(); ta.select(); } toast('Salin otomatis diblokir. Teks sudah terpilih, salin manual.'); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast('Tersalin.'); }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }
  function restoreFocus(sel) { var el = $(sel); if (el) el.focus(); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
    var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    if (act === 'close') closeDlg();
    else if (act === 'new-ing') openNewIng();
    else if (act === 'new-perl') openNewIng({ kind: 'perlengkapan' });
    else if (act === 'ni-cancel') cancelNewIng();
    else if (act === 'open-ing') {
      var ig0 = ingById(id);
      if (ig0 && ig0.homemadeId) { window.CC.ui.homemadeId = ig0.homemadeId; location.hash = '#homemade'; }
      else openIng(id);
    }
    else if (act === 'backup') openBackup();
    else if (act === 'more') openMore();
    else if (act === 'copy-backup') copyText($('#bk-out', dlg).value, $('#bk-out', dlg));
    else if (act === 'copy-raw') copyText(loadError.raw, $('#raw'));
    else if (act === 'reset-all') { loadError = null; state = seed(); save(); render(); toast('Data contoh dimuat.'); }
    else if (act === 'dismiss-seed') { state.seedNote = false; save(); renderBanners(); }
    else if (act === 'del-purchase') {
      var ing = ingById(t.getAttribute('data-ing'));
      if (ing && ing.purchases.length > 1) {
        ing.purchases = ing.purchases.filter(function (p) { return p.id !== id; });
        save(); openIng(ing.id, '#ap-qty'); render();
      }
    }
    else if (act === 'del-ing') {
      var ing2 = ingById(id), used = usedIn(id);
      if (CC.openDeleteIng) { CC.openDeleteIng(id); return; }
      if (used.length) openConfirm('Bahan masih dipakai', 'Bahan "' + esc(ing2.name) + '" ada di menu ' + used.map(function (m) { return esc(m.name); }).join(', ') + '. Hapus barisnya dari menu dulu, baru bahan ini bisa dihapus.', 'close', {}, 'Mengerti');
      else openConfirm('Hapus bahan?', 'Bahan "' + esc(ing2.name) + '" dan seluruh riwayat pembeliannya akan dihapus. Ini tidak bisa dibatalkan.', 'del-ing-ok', { id: id }, 'Hapus bahan');
    }
    else if (act === 'del-ing-ok') { state.ingredients = state.ingredients.filter(function (i) { return i.id !== id; }); save(); closeDlg(); render(); toast('Bahan dihapus.'); }
    else if (act === 'new-menu') openNewMenu();
    else if (act === 'del-menu') {
      var m = menuById(state.activeMenu);
      if (m) openConfirm('Hapus menu?', 'Menu "' + esc(m.name) + '" dan resepnya akan dihapus. Bahan di Bank of Goods tidak ikut terhapus.', 'del-menu-ok', { id: m.id }, 'Hapus menu');
    }
    else if (act === 'del-menu-ok') {
      state.menus = state.menus.filter(function (x) { return x.id !== id; });
      state.activeMenu = state.menus[0] ? state.menus[0].id : null; save(); closeDlg(); render(); toast('Menu dihapus.');
    }
    else if (act === 'add-line-new') {
      var mn2 = menuById(state.activeMenu), sec2 = t.getAttribute('data-sec'); if (!mn2) return;
      openNewIng({ onSaved: function (ni) {
        var nl2 = { id: uid('l'), section: sec2, ingId: ni.id, qty: null, unit: recipeUnit(ni) };
        mn2.lines.push(nl2); save(); closeDlg(); renderMenu(); restoreFocus('#qty-' + nl2.id);
      } });
    }
    else if (act === 'add-line') {
      var mm = menuById(state.activeMenu), sec = t.getAttribute('data-sec');
      if (!mm) return;
      var nl = { id: uid('l'), section: sec, ingId: '', qty: null, unit: 'g' };
      if (!state.ingredients.length) {
        openNewIng({ onSaved: function (ni) { nl.ingId = ni.id; nl.unit = recipeUnit(ni); mm.lines.push(nl); save(); closeDlg(); renderMenu(); restoreFocus('#qty-' + nl.id); } });
        return;
      }
      var raw = state.ingredients.filter(function (i) { return !isPerl(i); })[0] || state.ingredients[0];
      nl.ingId = raw.id; nl.unit = recipeUnit(raw);
      mm.lines.push(nl); save(); renderMenu(); restoreFocus('#ing-' + nl.id);
    }
    else if (act === 'rm-line') {
      var m3 = menuById(state.activeMenu); if (!m3) return;
      var gone = m3.lines.filter(function (l) { return l.id === id; })[0];
      m3.lines = m3.lines.filter(function (l) { return l.id !== id; }); save(); renderMenu();
      restoreFocus('[data-act="add-line"][data-sec="' + (gone ? gone.section : 'rtd') + '"]');
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'q') { $('#ing-list').innerHTML = ingListHTML(t.value); return; }
    if (t.id === 'ni-qty' || t.id === 'ni-price') { updateNewIngPreview(); return; }
    if (t.id === 'ni-dens') { refreshNewIng(true); return; }
    if (t.id === 'ni-pack') { refreshNewIng(false); return; }
    if (t.id === 'ap-qty' || t.id === 'ap-price') { var ig = ingById($('#f-add-purchase', dlg).getAttribute('data-id')); if (ig) updatePurchasePreview(ig); return; }
    var m = menuById(state.activeMenu); if (!m) return;
    var f = t.getAttribute('data-f');
    if (f) {
      if (f === 'name') m.name = t.value;
      else m[f] = numOrNull(t.value);
      save(); refreshCalc(); return;
    }
    var lf = t.getAttribute('data-lf');
    if (lf === 'qty') {
      var l = m.lines.filter(function (x) { return x.id === t.getAttribute('data-id'); })[0];
      if (l) { l.qty = numOrNull(t.value); save(); refreshCalc(); }
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.name === 'pm') { state.settings.priceMode = t.value; save(); $('#ing-list').innerHTML = ingListHTML($('#q').value); toast('Harga di COGS memakai ' + (t.value === 'avg' ? 'rata-rata tertimbang.' : 'pembelian terakhir.')); return; }
    if (t.name === 'ni-base' || t.name === 'ni-kind') { refreshNewIng(false); return; }
    if (t.id === 'ni-buy') { $('#ni-date-wrap', dlg).hidden = !t.checked; return; }
    if (t.name === 'bk') { ui.bankKind = t.value; $('#ing-list').innerHTML = ingListHTML($('#q').value); return; }
    if (t.id === 'ni-unit') { updateNewIngPreview(); return; }
    if (t.id === 'ni-pack-u') { refreshNewIng(true); return; }
    if (t.id === 'ap-unit') { var ig = ingById($('#f-add-purchase', dlg).getAttribute('data-id')); if (ig) updatePurchasePreview(ig); return; }
    if (t.id === 'menu-sel') { state.activeMenu = t.value; save(); renderMenu(); restoreFocus('#menu-sel'); return; }
    if (t.id === 'm-name') { var mn = menuById(state.activeMenu); if (mn) { var s = $('#menu-sel'); if (s) s.querySelector('option:checked').textContent = mn.name || 'Tanpa nama'; } return; }
    var m = menuById(state.activeMenu); if (!m) return;
    var lf = t.getAttribute('data-lf'); if (!lf) return;
    var l = m.lines.filter(function (x) { return x.id === t.getAttribute('data-id'); })[0]; if (!l) return;
    if (lf === 'ing' && t.value === '__new') {
      var mid = m.id, lid = l.id; t.value = l.ingId || '';
      openNewIng({ onSaved: function (ni) {
        var mm = menuById(mid), ll = mm && mm.lines.filter(function (x) { return x.id === lid; })[0];
        if (ll) { ll.ingId = ni.id; ll.unit = recipeUnit(ni); save(); }
        closeDlg(); renderMenu(); restoreFocus('#qty-' + lid);
      } });
      return;
    }
    if (lf === 'ing') {
      l.ingId = t.value; var ing = ingById(l.ingId);
      if (ing && unitOptions(ing).indexOf(l.unit) < 0) l.unit = unitOptions(ing)[0];
      save(); renderMenu(); restoreFocus('#ing-' + l.id);
    } else if (lf === 'unit') { l.unit = t.value; save(); refreshCalc(); }
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === 'f-new-ing') submitNewIng();
    else if (f.id === 'f-new-menu') {
      var name = $('#nm-name', dlg).value.trim();
      if (!name) { $('#nm-err', dlg).textContent = 'Isi nama menu.'; $('#nm-name', dlg).focus(); return; }
      var nm = { id: uid('m'), name: name, price: null, targetMargin: null, loss: 0, lines: [] };
      state.menus.push(nm); state.activeMenu = nm.id; save(); closeDlg(); location.hash = '#menu'; render(); toast('Menu "' + name + '" dibuat.');
    }
    else if (f.id === 'f-edit-ing') {
      var ing = ingById(f.getAttribute('data-id')), nameV = $('#ei-name', dlg).value.trim(), err = $('#ei-err', dlg);
      if (!nameV) { err.textContent = 'Nama bahan tidak boleh kosong.'; $('#ei-name', dlg).focus(); return; }
      var dEl = $('#ei-dens', dlg), dens = dEl ? numOrNull(dEl.value) : null;
      var pEl = $('#ei-pack', dlg), pack = pEl ? numOrNull(pEl.value) : null;
      if (pEl && !(pack > 0) && ing.packSize > 0 && ing.purchases.some(function (p) { return p.unit === 'pcs'; })) { err.textContent = 'Ada pembelian yang dicatat per pcs. Isi per kemasan tidak bisa dikosongkan.'; pEl.focus(); return; }
      var rqEl = $('#ei-rq', dlg), ref = ing.refPrice;
      if (rqEl) {
        var rq = numOrNull(rqEl.value), rpv = numOrNull($('#ei-rp', dlg).value), ru = $('#ei-ru', dlg).value;
        if (rq == null && rpv == null) ref = null;
        else {
          if (!(rq > 0) || rpv == null || !(rpv >= 0)) { err.textContent = 'Harga acuan: isi jumlah dan harga total, atau kosongkan keduanya.'; rqEl.focus(); return; }
          var tmp = { base: ing.base, density: dEl ? (dens > 0 ? dens : null) : ing.density, packSize: pEl ? (pack > 0 ? pack : null) : ing.packSize };
          if (toBase(tmp, rq, ru) == null) { err.textContent = 'Harga acuan: satuan tidak cocok dengan bahan.'; return; }
          ref = { qty: rq, unit: ru, price: rpv, date: todayISO() };
        }
      }
      var kEl = $('input[name="ei-kind"]:checked', dlg);
      ing.name = nameV; if (dEl) ing.density = dens > 0 ? dens : null; if (pEl) ing.packSize = pack > 0 ? pack : null;
      ing.refPrice = ref; if (kEl) ing.kind = kEl.value;
      save(); closeDlg(); render(); toast('Perubahan disimpan.');
    }
    else if (f.id === 'f-add-purchase') {
      var ig = ingById(f.getAttribute('data-id')), er = $('#ap-err', dlg);
      var qty = numOrNull($('#ap-qty', dlg).value), price = numOrNull($('#ap-price', dlg).value), unit = $('#ap-unit', dlg).value, date = $('#ap-date', dlg).value;
      if (!(qty > 0)) { er.textContent = 'Isi jumlah yang lebih dari 0.'; $('#ap-qty', dlg).focus(); return; }
      if (price === null || !(price >= 0)) { er.textContent = 'Isi harga total.'; $('#ap-price', dlg).focus(); return; }
      if (!date) { er.textContent = 'Pilih tanggal beli.'; return; }
      if (toBase(ig, qty, unit) == null) { er.textContent = 'Satuan tidak cocok dengan bahan ini.'; return; }
      ig.purchases.push({ id: uid('p'), date: date, qty: qty, unit: unit, price: price });
      save(); openIng(ig.id, '#ap-qty'); render(); toast('Pembelian ditambahkan.');
    }
    else if (f.id === 'f-restore') {
      var txt = $('#bk-in', dlg).value.trim(), e2 = $('#bk-err', dlg);
      try {
        var d = JSON.parse(txt);
        if (!validShape(d)) throw new Error('Isinya bukan cadangan Coffee Cost.');
        state = migrate(d); loadError = null; save(); closeDlg(); render(); toast('Data dipulihkan.');
      } catch (x) { e2.textContent = 'Cadangan tidak bisa dibaca. ' + x.message + ' Tempel seluruh teks hasil Salin cadangan.'; $('#bk-in', dlg).focus(); }
    }
  });

  /* ---------- registry for feature modules ---------- */
  addRoute('menu', { label: 'Menu dan COGS', order: 50, primary: false, render: renderMenu });
  addRoute('bank', { label: 'Bank of Goods', order: 60, primary: false, render: renderBank });
  function addDays(iso, n) {
    var d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  window.CC = {
    get state() { return state; },
    save: save, render: render, addRoute: addRoute, esc: esc, rp: rp, nf2: nf2, nf0: nf0, NB: NB,
    fmtDate: fmtDate, todayISO: todayISO, addDays: addDays, numOrNull: numOrNull, uid: uid, toast: toast,
    openDlg: openDlg, closeDlg: closeDlg, dlgHead: dlgHead, openConfirm: openConfirm,
    calcMenu: calcMenu, menuById: menuById, ingById: ingById, toBase: toBase, $: $, leader: leader,
    pricePerBase: pricePerBase, unitOptions: unitOptions, unitLabel: unitLabel, packText: packText, calcHomemade: calcHomemade, homemadeById: homemadeById, usedIn: usedIn,
    costOutHTML: costOutHTML, baseLabel: baseLabel,
    view: view, dlg: dlg, UNITS: UNITS, ui: ui, openNewIng: openNewIng, ingOptionsHTML: ingOptionsHTML, recipeUnit: recipeUnit, isPerl: isPerl, refPerBase: refPerBase,
    applyRemote: function (patch) {
      Object.keys(patch).forEach(function (k) { state[k] = patch[k]; });
      try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { storageOk = false; }
      render(false);
    },
    addSaveHook: function (f) { saveHooks.push(f); }, addRenderHook: function (f) { renderHooks.push(f); },
    replaceState: function (d) {
      state = migrate(d); loadError = null;
      try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { storageOk = false; }
      render(false);
    },
    start: function () { state = load(); if (state) save(); buildNav(); render(false); }
  };
})();
</script>
